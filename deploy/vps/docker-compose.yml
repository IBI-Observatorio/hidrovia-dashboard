services:
  web:
    # Pinada pelo digest (imutável). Comandos manuais: DIGEST=$(cut -d@ -f2 tag) docker compose ps
    image: ghcr.io/ibi-observatorio/hidrovia-dashboard@${DIGEST:?DIGEST ausente - use deploy.sh}
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8120:3000"
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
