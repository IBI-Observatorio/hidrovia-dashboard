# /etc/nginx/sites-available/dados.ibi-observatorio.org
# O Certbot acrescenta o bloco 443 e o redirecionamento http→https.
server {
    listen 80;
    listen [::]:80;
    # dados-vps.* = nome temporário p/ validar a VPS antes da virada do DNS de dados.*
    server_name dados.ibi-observatorio.org dados-vps.ibi-observatorio.org;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;   # upload de PDF SEMA no /admin/upload
    }
}
