name: Deploy

on:
  push:
    branches: [main]
  # Permite que outros workflows (ex.: idn-semanal) disparem o deploy apos
  # commitar dados — pushes via GITHUB_TOKEN nao acionam o gatilho `push`,
  # mas workflow_dispatch e excecao a essa regra anti-recursao do GitHub.
  workflow_dispatch:

jobs:
  # Job do Railway removido em 13/10/2026: o construtor novo do Railway passou a gerar
  # imagem sem node_modules (next: not found) e derrubou a producao. O Railway fica
  # congelado na ultima versao boa ate a virada do DNS para a VPS.

  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ibi-observatorio/hidrovia-dashboard:${{ github.sha }}
            ghcr.io/ibi-observatorio/hidrovia-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Trava só este job: um deploy esperando aprovação não segura o job do Railway.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy na VPS (envia sha@digest; a chave só roda deploy.sh)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes hidrovia-deploy@2.24.121.118 "${{ github.sha }}@${{ needs.build.outputs.digest }}"
